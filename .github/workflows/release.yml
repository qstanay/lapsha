name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lapsha
          POSTGRES_PASSWORD: lapsha
          POSTGRES_DB: lapsha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lapsha -d lapsha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://lapsha:lapsha@localhost:5432/lapsha
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${tag} does not match package.json version ${version}."
            exit 1
          fi
      - run: pnpm publish
